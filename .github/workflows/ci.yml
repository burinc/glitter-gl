name: CI

# ---------------------------------------------------------------------------
# Runs on pull requests and pushes to main, plus manual dispatch.
#
# Two jobs, with different jobs to do.
#
#   `gates` is HEADLESS and is the required one. It proves the unit suite
#   passes and the tree is lint-, format- and ns-clean on a machine that is not
#   the maintainer's. It does NOT prove any OpenGL command executed:
#   glitter-gl.offscreen-test probes for a display and prints "SKIP offscreen
#   GL: ..." when there is none, which is the expected outcome there.
#
#   `gl` closes exactly that hole, under Xvfb and mesa's llvmpipe, and asserts
#   the skip did NOT happen. It is required too, as of 9 consecutive green
#   runs answering the question it was added to settle. See that job's own
#   header.
#
# The lint gate here is `bb lint:strict`, which fails on warnings as well as
# errors. That is stricter than glitter's own CI, which uses an errors-only
# gate because its tree carries two known warnings. glitter-gl's tree reports
# zero findings, so the stricter gate is the one worth keeping clean. If a
# warning ever lands that is genuinely worth accepting, relax this to the
# errors-only form the `bb hooks:install` pre-commit hook uses rather than
# silencing it, so CI and a clean local commit keep agreeing.
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      jolt-version:
        description: "jolt version to install (blank = the pinned JOLT_VERSION below)"
        required: false
        default: ""

permissions:
  contents: read

# jolt is pinned for the same reason clj-kondo, clojure-lsp and babashka are
# pinned further down: a floating `latest` lets a release published overnight
# turn CI red on a tree nobody touched. It used to float, which is how a
# breaking change to jolt.ffi/write reached a pull request here as an opaque
# test crash rather than as a version mismatch anyone could read.
#
# So moving this pin IS the cutover commit for a breaking jolt change. Bump it
# and adapt the call sites together, in one reviewed commit, rather than
# letting the release date decide when main breaks. Try the candidate first
# with a workflow_dispatch run and the jolt-version input, which overrides
# this for that run only.
env:
  JOLT_VERSION: ${{ inputs.jolt-version || '0.8.0' }}

# A second push to the same branch makes the first run's answer stale, so stop
# it rather than paying for both. Never cancels a run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gates:
    name: test / lint / format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      # Two native dependency groups, from two different places:
      #
      #   GTK4 + GLib arrive transitively through the pinned glitter dep, whose
      #   :jolt/native looks for libgtk-4.so.1 / libglib-2.0.so.0 and friends,
      #   falling back to the unversioned .so names.
      #
      #   OpenGL is glitter-gl's own :jolt/native entry, which asks for
      #   libGL.so.1 first and libGL.so second.
      #
      # The -dev packages ship both the versioned runtime object and the
      # unversioned development symlink, so they cover either resolution path;
      # the runtime packages alone would only satisfy the versioned one.
      - name: Install GTK4, GLib and OpenGL
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libgl-dev

          echo "::group::what resolved"
          ldconfig -p | grep -E 'libgtk-4|libglib-2\.0|libgobject-2\.0|libgio-2\.0|libGL\.so' || true
          echo "::endgroup::"

      # Official install script from jolt's README, which owns the archive
      # naming and verifies the checksum. $JOLT_VERSION comes from the
      # workflow-level env above and is read by the script rather than
      # interpolated into it, so the dispatch input cannot inject shell.
      - name: Install jolt
        run: |
          set -euo pipefail
          : "${JOLT_VERSION:?empty; the workflow-level pin did not resolve}"
          curl -sSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --version "$JOLT_VERSION"
          jolt --version

      # Pinned to match what the maintainer runs locally and what the
      # `bb hooks:install` pre-commit hook enforces. Floating these to `latest`
      # would let CI disagree with a clean local commit whenever clj-kondo or
      # clojure-lsp changes a default. `cli` is needed by clojure-lsp for
      # classpath discovery.
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: 1.12.196
          clj-kondo: "2026.05.25"
          cli: latest

      - uses: clojure-lsp/setup-clojure-lsp@v1.0.3
        with:
          clojure-lsp-version: "2026.05.05-12.58.26"

      # deps.edn pins glitter as a git coordinate, so every cold run clones it
      # and resolves its Maven deps. ~/.jolt/{gitlibs,mvnlibs} is jolt's own
      # cache; ~/.gitlibs and ~/.m2 are the Clojure CLI's, used by clojure-lsp
      # when it discovers the classpath. A miss only costs the fetch.
      #
      # ~/.jolt/aot-cache is deliberately NOT cached: it is keyed to the jolt
      # build that produced it, and this workflow can install a different one
      # via the jolt-version input.
      - name: Cache dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.jolt/gitlibs
            ~/.jolt/mvnlibs
            ~/.gitlibs
            ~/.m2/repository
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: deps-${{ runner.os }}-

      # Headless: the suite runs against pure geometry/matrix/mesh code plus
      # glitter's in-memory test renderer. Failure output is re-emitted as an
      # annotation plus a job summary, both readable without downloading the
      # log archive.
      - name: Unit suite
        run: |
          set +e
          out="$(bb test 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            {
              printf '### `bb test` failed (exit %s)\n\n```\n%s\n```\n' \
                "$rc" "$(printf '%s\n' "$out" | tail -60)"
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$out" | tail -c 2000 \
              | python3 -c 'import sys; print("::error title=bb test failed::" + sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$rc"

      # `.clj-kondo/hooks/jolt_ffi.clj` rewrites jolt.ffi/defcfn into an
      # equivalent defn so clj-kondo can see through the FFI macro. Without it
      # every gl-*/gtk-*/gdk-* binding reports as unresolved.
      - name: clj-kondo
        run: bb lint:strict

      # Formatting is owned by clojure-lsp, not cljfmt: the two disagree on
      # some compact literal tables. See CONTRIBUTING.md.
      - name: Formatting
        run: bb lsp:format-check

      - name: Namespace forms
        run: bb lsp:clean-ns-check

      # CONTRIBUTING.md's prose convention, in gate form. The pattern is the
      # \u2014 escape rather than the character itself, matching the command
      # CONTRIBUTING.md documents, so a grep over this repo for the literal
      # never trips over the gate's own source. AGENTS.md and CLAUDE.md are
      # untracked symlinks into a private planning store, so `git ls-files`
      # correctly leaves them out and grep never sees a dangling link.
      - name: Prose (no em-dashes in Markdown)
        run: |
          if git ls-files -z '*.md' | xargs -0 -r grep -n $'\u2014'; then
            echo "::error title=em-dash found::CONTRIBUTING.md asks for a comma, colon, semicolon, parenthesis or sentence break instead. Lines above."
            exit 1
          fi
          echo "clean"

      # Report only, deliberately. Three functions are flagged today, and one
      # of them (polygon.clj's `cog`) sits in a verbatim-ported file that
      # Invariant #1 says must not be reshaped without its own reviewed commit.
      # So this reports the count into the run's summary as a drift signal
      # without failing the branch. Promote it to `bb check:positional-args:strict`
      # if those three are ever resolved.
      - name: Positional-args report
        continue-on-error: true
        run: |
          set +e
          out="$(bb check:positional-args 2>&1)"
          printf '%s\n' "$out"
          {
            printf '### Positional-args report\n\n```\n%s\n```\n' \
              "$(printf '%s\n' "$out" | tail -30)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # Runs only when something above failed. The native libraries are present
      # as FILES well before anything dlopens them, so a library that resolves
      # but will not load (a missing runtime dependency on a headless runner)
      # gets past the install step and fails later. This reports the linkage
      # facts that tell those two apart.
      - name: Diagnostics (on failure)
        if: failure()
        run: |
          set +e
          gtk="$(ldconfig -p | grep -m1 'libgtk-4' | awk '{print $NF}')"
          gl="$(ldconfig -p | grep -m1 'libGL\.so' | awk '{print $NF}')"
          {
            for lib in "$gtk" "$gl"; do
              echo "resolved: ${lib:-<not in ldconfig cache>}"
              if [ -n "$lib" ]; then ldd "$lib" 2>&1; else echo "  (skipped)"; fi
              echo
            done
            echo "unresolved above (if any) are the missing runtime deps."
            echo
            echo "jolt:  $(jolt --version 2>&1 | head -1)"
            echo "bb:    $(bb --version 2>&1 | head -1)"
          } > /tmp/diag.txt
          cat /tmp/diag.txt
          {
            printf '### Diagnostics\n\n```\n'; cat /tmp/diag.txt; printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -c 2000 /tmp/diag.txt \
            | python3 -c 'import sys; print("::error title=native library diagnostics::" + sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'

  # ---------------------------------------------------------------------------
  # The gate the headless job above cannot be: one that actually issues OpenGL
  # commands. Xvfb supplies a display, mesa's llvmpipe supplies a software
  # rasterizer, and between them GDK can hand out a real GL context on a runner
  # with no GPU.
  #
  # The question this job was added to answer, whether llvmpipe gives GDK a
  # context at GL 3.3 or better (what offscreen-test asserts, and what the
  # #version 330 core shaders need), is answered: it reports GL 4.5. The job
  # ran green 9 times out of 9 while informational, so it is now required and
  # a red run blocks the merge.
  #
  # The likeliest source of a false red is timing rather than GL. gl-area-smoke
  # gives the window 2000ms to realize and paint before its auto-quit timer
  # closes it, which is generous under llvmpipe on a warm runner and untested
  # against a badly contended one. If this job starts flapping, raise that
  # budget in examples/glitter_gl/gl_area_smoke.clj before reaching for
  # continue-on-error: a missed frame leaves :rendered? false, which looks
  # exactly like a real widget-layer regression.
  #
  # Guarding against a green no-op is the whole design here. offscreen-test
  # PASSES when it skips, by design, because a machine with no display is a
  # legitimate environment rather than a failure. That makes `bb test` going
  # green worthless as evidence for this job, so the Unit suite step below
  # reads the output and fails when it finds the skip banner. A job that proves
  # GL ran has to check that GL ran.
  # ---------------------------------------------------------------------------
  gl:
    name: OpenGL under Xvfb
    runs-on: ubuntu-latest

    env:
      DISPLAY: ":99"
      # Force the software rasterizer rather than letting mesa hunt for a GPU
      # that is not there.
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      GDK_BACKEND: x11

    steps:
      - uses: actions/checkout@v7.0.1

      # libgl1-mesa-dri is the load-bearing one and the easiest to leave out:
      # libgl-dev alone provides the GLX/loader side, but the actual llvmpipe
      # rasterizer ships in the DRI package. Without it a context request fails
      # rather than falling back to software. libegl1 and libgbm1 are here
      # because GTK 4.6 and later prefer EGL over GLX on X11, so the EGL path
      # is the one most likely to be taken. mesa-utils supplies glxinfo, used
      # by the probe step below.
      - name: Install GTK4, GLib, mesa and Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libgl-dev \
            libgl1-mesa-dri libegl1 libegl-mesa0 libgbm1 \
            xvfb x11-utils mesa-utils

      - name: Start Xvfb
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          for i in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "Xvfb up after ${i} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error title=Xvfb never came up::xdpyinfo could not reach :99 after 30s"
          exit 1

      # Front-loaded deliberately. If llvmpipe cannot reach GL 3.3 this reports
      # exactly that, in one run, instead of leaving it to be inferred from a
      # test failure further down. Never blocks: it is evidence, not a gate.
      - name: Probe available GL
        continue-on-error: true
        run: |
          set +e
          {
            echo "== glxinfo -B =="
            glxinfo -B 2>&1
            echo
            echo "== version lines =="
            glxinfo 2>&1 | grep -iE 'OpenGL (core profile )?(version|renderer|vendor)'
          } > /tmp/gl.txt
          cat /tmp/gl.txt
          { printf '### GL probe\n\n```\n'; cat /tmp/gl.txt; printf '```\n'; } >> "$GITHUB_STEP_SUMMARY"

      # Same pin and the same dispatch override as the gates job. This step
      # used to hardcode the latest release, so a run that dispatched a
      # candidate jolt tested it on one job out of two and reported green from
      # the other on a different runtime entirely.
      - name: Install jolt
        run: |
          set -euo pipefail
          : "${JOLT_VERSION:?empty; the workflow-level pin did not resolve}"
          curl -sSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --version "$JOLT_VERSION"
          jolt --version

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: 1.12.196

      - name: Cache dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.jolt/gitlibs
            ~/.jolt/mvnlibs
          key: gl-deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: gl-deps-${{ runner.os }}-

      # The anti-no-op check described in this job's header. `bb test` going
      # green is necessary but nowhere near sufficient, because the skip path
      # is also green. Both conditions have to hold: no skip banner, and a
      # real version banner from a context that was actually created.
      - name: Unit suite (asserting GL really ran)
        run: |
          set +e
          out="$(bb test 2>&1)"; rc=$?
          printf '%s\n' "$out"

          if [ "$rc" -ne 0 ]; then
            echo "::error title=bb test failed under Xvfb::exit $rc"
            exit "$rc"
          fi

          # offscreen-test prints "SKIP offscreen GL: <reason>" when it could
          # not get a context. Green-but-skipped is the failure this job exists
          # to catch, so it is an error here even though the suite passed.
          if printf '%s\n' "$out" | grep -q 'SKIP offscreen GL'; then
            reason="$(printf '%s\n' "$out" | grep -m1 'SKIP offscreen GL')"
            echo "::error title=GL did not run::$reason"
            { printf '### GL did not run\n\n```\n%s\n```\n' "$reason"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # The success path prints "offscreen GL <maj> . <mnr> <renderer>".
          banner="$(printf '%s\n' "$out" | grep -m1 'offscreen GL [0-9]')"
          if [ -z "$banner" ]; then
            echo "::error title=No GL banner::offscreen-test printed neither a skip nor a version line. Its output shape may have changed."
            exit 1
          fi

          echo "::notice title=GL ran::$banner"
          { printf '### GL ran\n\n```\n%s\n```\n' "$banner"; } >> "$GITHUB_STEP_SUMMARY"

      # gl-area-smoke mounts a real [:gl-area] through glitter's reconciler and
      # self-closes via :auto-quit-ms, exiting 1 unless realize, render and
      # resize all fired. That is the widget-layer coverage no headless run can
      # give. `bb smokes` runs it, then the headless check.
      - name: Live-GTK smokes
        run: bb smokes

      - name: Diagnostics (on failure)
        if: failure()
        run: |
          set +e
          {
            echo "DISPLAY=$DISPLAY"
            xdpyinfo -display :99 2>&1 | head -12
            echo
            echo "glxinfo -B:"; glxinfo -B 2>&1 | head -20
            echo
            echo "jolt: $(jolt --version 2>&1 | head -1)"
          } > /tmp/diag.txt
          cat /tmp/diag.txt
          { printf '### Xvfb diagnostics\n\n```\n'; cat /tmp/diag.txt; printf '```\n'; } >> "$GITHUB_STEP_SUMMARY"
